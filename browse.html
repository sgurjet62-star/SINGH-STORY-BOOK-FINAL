<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SeaShelf</title>
    <link rel="stylesheet" href="style.css">
</head>
<body data-page="browse">

<header class="site-header">
    <div class="container header-inner">
        <a class="brand" href="index.html">Sea<span>Shelf</span></a>
        <button class="icon-btn menu-toggle" id="menuToggle">☰</button>
        <nav class="site-nav" id="siteNav">
            <a href="index.html">Home</a>
            <a class="active" href="browse.html">Browse</a>
            <a href="genre.html">Genres</a>
            <a href="bookmarks.html">Bookmarks</a>
        </nav>
        <button class="icon-btn" id="themeToggle">☾ Dark</button>
    </div>
</header>

<main class="container page-top">
    <div class="page-heading">
    </div>

    <div class="filter-bar">
        <input id="searchInput" type="search"
               placeholder="Search stories..." aria-label="Search stories">

        <select id="genreFilter" aria-label="Filter by genre">
            <option value="">All Genres</option>
        </select>

        <select id="sortFilter" aria-label="Sort stories">
            <option value="featured">Featured</option>
            <option value="az">Title A–Z</option>
            <option value="za">Title Z–A</option>
        </select>
    </div>

    <p id="resultCount" class="result-line"></p>
    <div class="book-grid" id="browseGrid"></div>
</main>

<footer class="site-footer">
    <div class="container footer-inner">
        <strong>SeaShelf</strong>
    </div>
</footer>

<div class="toast" id="toast" role="status"></div>
<script src="script.js"></script>
</body>
</html>
