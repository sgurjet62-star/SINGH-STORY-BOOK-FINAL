<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SeaShelf</title>
    <link rel="stylesheet" href="style.css">
</head>
<body data-page="genre">

<header class="site-header">
    <div class="container header-inner">
        <a class="brand" href="index.html">Sea<span>Shelf</span></a>
        <button class="icon-btn menu-toggle" id="menuToggle">☰</button>
        <nav class="site-nav" id="siteNav">
            <a href="index.html">Home</a>
            <a href="browse.html">Browse</a>
            <a class="active" href="genre.html">Genres</a>
            <a href="bookmarks.html">Bookmarks</a>
        </nav>
        <button class="icon-btn" id="themeToggle">☾ Dark</button>
    </div>
</header>

<main class="container page-top">
    <div class="page-heading">
        <h1 id="genreHeading">Explore All Genres</h1>
        <p>Choose a genre to find your next read.</p>
    </div>

    <div class="filter-bar">
        <label for="genrePageFilter">Choose a genre:</label>
        <select id="genrePageFilter">
            <option value="All">All Genres</option>
        </select>
    </div>

    <div class="book-grid" id="genreGrid"></div>
</main>

<footer class="site-footer">
    <div class="container footer-inner">
        <strong>SeaShelf</strong>
    </div>
</footer>

<div class="toast" id="toast" role="status"></div>
<script src="script.js"></script>
</body>
</html>
